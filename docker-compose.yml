name: simulative-docker-final

x-environment: &common-environment
  TZ: ${TZ:-Europe/Moscow}
  PGTZ: ${PGTZ:-Europe/Moscow}

x-app: &default-app
  environment: *common-environment
  restart: unless-stopped
  networks: [shop]
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"

services:
  postgres:
    <<: *default-app
    image: ${DOCKERHUB_USER:-gilachone}/simulative-docker-postgres:${IMAGE_TAG:-1.1}
    environment:
      <<: *common-environment
      POSTGRES_DB: ${POSTGRES_DB:-shop}
      POSTGRES_USER: ${POSTGRES_USER:-shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop_password}
      PGPORT: ${POSTGRES_PORT:-5432}
    command: [postgres, -p, "${POSTGRES_PORT:-5432}"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 192m
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -p "$${PGPORT}" -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  python:
    <<: *default-app
    image: ${DOCKERHUB_USER:-gilachone}/simulative-docker-python:${IMAGE_TAG:-1.1}
    environment:
      <<: *common-environment
      DB_HOST: ${POSTGRES_HOST:-postgres}
      DB_PORT: ${POSTGRES_PORT:-5432}
      DB_NAME: ${POSTGRES_DB:-shop}
      DB_USER: ${POSTGRES_USER:-shop}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-shop_password}
    mem_limit: 192m
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  nginx:
    <<: *default-app
    image: ${DOCKERHUB_USER:-gilachone}/simulative-docker-nginx:${IMAGE_TAG:-1.1}
    ports:
      - '127.0.0.1:${WEB_PORT:-8090}:80'
    volumes:
      - nginx_logs:/var/log/nginx
    mem_limit: 64m
    depends_on:
      python:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/health']
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  shop:
    driver: bridge

volumes:
  pgdata:
  nginx_logs:
