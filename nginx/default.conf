server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    location / {
        try_files $uri $uri/ =404;
    }
    location /api/ {
        proxy_pass http://python:8000;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
    location = /health {
        proxy_pass http://python:8000/health;
    }
}
