<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Продажи магазина</title>
<style>
body{font:17px system-ui,sans-serif;background:#f4f6f8;color:#243342;margin:40px auto;max-width:960px;padding:0 20px}
h1{margin-bottom:8px}p{color:#516478}.cards{display:flex;gap:16px;margin:30px 0;flex-wrap:wrap}.card{background:white;border:1px solid #dce3e9;border-radius:10px;padding:22px;flex:1}.card b{display:block;font-size:30px;margin-top:8px;color:#177b6b}table{background:white;border-collapse:collapse;width:100%}td,th{text-align:left;padding:14px;border-bottom:1px solid #dce3e9}th{background:#e7eeef}#error{color:#a32727}
</style>
<h1>Продажи магазина</h1>
<p>Учебные данные за 1–4 сентября 2026 года</p>
<div class="cards"><div class="card">Выручка<b id="revenue">—</b></div><div class="card">Продаж<b id="sales">—</b></div><div class="card">Товаров продано<b id="quantity">—</b></div></div>
<p id="error" role="alert"></p>
<table><thead><tr><th>Дата</th><th>Товар</th><th>Количество</th><th>Цена</th><th>Сумма</th></tr></thead><tbody id="rows"></tbody></table>
<script>
const money = value => Number(value).toLocaleString('ru-RU',{style:'currency',currency:'RUB'});
async function load(){
  try{
    const responses=await Promise.all([fetch('/api/summary'),fetch('/api/sales')]);
    if(responses.some(r=>!r.ok))throw new Error('Не удалось загрузить данные');
    const [summary,rows]=await Promise.all(responses.map(r=>r.json()));
    document.querySelector('#revenue').textContent=money(summary.revenue);
    document.querySelector('#sales').textContent=summary.sales;
    document.querySelector('#quantity').textContent=summary.quantity;
    for(const row of rows){const tr=document.createElement('tr');
      for(const value of [row.date,row.product,row.quantity,money(row.price),money(row.total)]){
        const td=document.createElement('td');td.textContent=value;tr.append(td);
      }document.querySelector('#rows').append(tr);
    }
  }catch(error){document.querySelector('#error').textContent='Не удалось загрузить продажи. Обновите страницу чуть позже.';}
}
load();
</script>
</html>
